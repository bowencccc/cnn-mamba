[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnn-mamba-k7"
version = "0.1.0"
description = "Portable CNN-Mamba-k7 genomic site prediction pipeline"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "matplotlib==3.10.8",
  "pysam==0.23.3",
  "scikit-learn==1.7.2",
  "torch==2.6.0",
  "mamba-ssm @ git+https://github.com/state-spaces/mamba.git@be0303b971cd79a4fbbcfc411a01b33f6b0e3602",
  "causal-conv1d==1.6.1",
]

[project.scripts]
cnn-mamba-prepare-droso = "cnn_mamba.prepare_droso:main"
cnn-mamba-prepare-human = "cnn_mamba.prepare_human:main"
cnn-mamba-train = "cnn_mamba.train:main"
cnn-mamba-score = "cnn_mamba.score_chromosome:main"
cnn-mamba-auprc = "cnn_mamba.evaluate_candidates:main"
cnn-mamba-export-uniann = "cnn_mamba.export_uniann_scores:main"
cnn-mamba-uniann-eval = "cnn_mamba.uniann_evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]
